name: Publish static dashboard demo


on:
  push:
    branches: [main]
    paths:
      - "github-pages-demo/**"
      - ".github/workflows/pages-demo.yml"
  workflow_dispatch:


permissions:
  contents: read
  pages: write
  id-token: write


concurrency:
  group: github-pages
  cancel-in-progress: true


jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static demo only
        uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages-demo
      - name: Deploy to GitHub Pages
        id: deployment
